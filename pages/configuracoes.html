<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17130f" />
    <meta
      name="description"
      content="Ajuste a dificuldade e os efeitos sonoros."
    />
    <title>Configurações — Crônicas de Eldoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="../index.html" aria-label="Voltar ao menu">
          <span class="brand-mark">✦</span
          ><span>CRÔNICAS DE <b>ELDORIA</b></span>
        </a>
        <span class="topbar-caption">◆ ARQUIVOS DA GUILDA ◆</span>
      </header>

      <section class="screen content-screen active">
        <a class="back-button" href="../index.html">← Voltar ao menu</a>
        <p class="eyebrow">AJUSTES DA AVENTURA</p>
        <h2>Configurações</h2>
        <div class="settings-panel">
          <label class="setting-row"
            ><span
              ><b>Dificuldade</b
              ><small>Quantidade de pares na partida</small></span
            >
            <select id="difficulty-select">
              <option value="easy">Aprendiz · 4 pares</option>
              <option value="normal" selected>Aventureiro · 6 pares</option>
              <option value="hard">Lenda · 8 pares</option>
            </select>
          </label>
          <label class="setting-row"
            ><span
              ><b>Efeitos sonoros</b
              ><small>Controle visual preparado para áudio futuro</small></span
            >
            <input id="sound-toggle" type="checkbox" checked />
          </label>
          <p class="settings-note">
            As configurações são salvas automaticamente e aplicadas na próxima
            partida. O jogo funciona sem arquivos de áudio externos.
          </p>
        </div>
      </section>

      <footer class="site-footer">
        FEITO PARA AVENTUREIROS • ELDORIA © 2026
      </footer>
    </main>
    <script type="module" src="../js/pages/settings-page.js"></script>
  </body>
</html>
